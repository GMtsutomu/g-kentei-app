<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G検定 模擬テスト（全999問）</title>

<!-- PWA メタタグ (iOS Safari / Mobile) -->
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="G検定模擬">
<meta name="theme-color" content="#0f172a">
<meta name="format-detection" content="telephone=no">

<style>
  :root{
    --bg:#0f172a;
    --card:#ffffff;
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --correct:#16a34a;
    --incorrect:#dc2626;
    --text:#1e293b;
    --muted:#64748b;
    --border:#e2e8f0;
    --chip:#eef2ff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"Hiragino Sans","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,#0f172a 0%,#1e3a8a 45%,#1e40af 100%);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px;
  }
  .app{
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  header.top{
    text-align:center;
    color:#fff;
    padding:8px 4px 2px;
  }
  header.top h1{
    font-size:20px;
    margin:0 0 4px;
    letter-spacing:0.5px;
  }
  header.top p{
    margin:0;
    font-size:12px;
    color:#cbd5e1;
  }
  .card{
    background:var(--card);
    border-radius:16px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
  }
  .home-stats{
    display:flex;
    justify-content:space-between;
    background:var(--chip);
    border-radius:12px;
    padding:12px 16px;
    margin-bottom:14px;
    font-size:13px;
    color:var(--muted);
  }
  .home-stats b{
    color:var(--text);
    font-size:16px;
  }
  .cat-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .cat-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    text-align:left;
    padding:14px 16px;
    border-radius:12px;
    border:1px solid var(--border);
    background:#f8fafc;
    cursor:pointer;
    font-size:14.5px;
    color:var(--text);
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .cat-btn:active{transform:scale(0.98);}
  .cat-btn:hover{background:#eef2ff; box-shadow:0 4px 10px rgba(37,99,235,0.15);}
  .cat-btn .meta{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:2px;
  }
  .cat-btn .count{
    font-size:11.5px;
    color:var(--muted);
  }
  .cat-btn.disabled{
    opacity:0.45;
    cursor:not-allowed;
  }
  .cat-btn.wrong{
    background:#fff1f2;
    border-color:#fecdd3;
  }
  .cat-btn.wrong:hover{background:#ffe4e6;}
  .badge{
    display:inline-block;
    font-size:11px;
    padding:2px 8px;
    border-radius:999px;
    background:var(--primary);
    color:#fff;
    font-weight:600;
  }
  .badge.red{background:var(--incorrect);}
  .section-label{
    font-size:12.5px;
    font-weight:700;
    color:var(--muted);
    margin:14px 0 8px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .quiz-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .quiz-top .progress-text{
    font-size:13px;
    color:var(--muted);
    font-weight:600;
  }
  .progress-bar-track{
    height:6px;
    width:100%;
    background:#e2e8f0;
    border-radius:999px;
    overflow:hidden;
    margin-bottom:16px;
  }
  .progress-bar-fill{
    height:100%;
    background:linear-gradient(90deg,#2563eb,#3b82f6);
    transition:width .3s ease;
  }
  .cat-chip{
    display:inline-block;
    font-size:11px;
    background:var(--chip);
    color:var(--primary-dark);
    padding:3px 10px;
    border-radius:999px;
    margin-bottom:10px;
    font-weight:600;
  }
  .question-text{
    font-size:16px;
    line-height:1.6;
    margin:6px 0 18px;
    font-weight:600;
    white-space:pre-wrap;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .option-btn{
    display:flex;
    align-items:flex-start;
    gap:10px;
    text-align:left;
    padding:13px 14px;
    border-radius:12px;
    border:1.5px solid var(--border);
    background:#fff;
    font-size:14px;
    line-height:1.5;
    cursor:pointer;
    color:var(--text);
    transition:border-color .12s ease, background .12s ease;
  }
  .option-btn:hover:not(.locked){
    border-color:var(--primary);
    background:#f5f8ff;
  }
  .option-btn .idx{
    flex:0 0 auto;
    width:22px;
    height:22px;
    border-radius:50%;
    background:#e2e8f0;
    color:var(--muted);
    font-size:12px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:1px;
  }
  .option-btn.correct{
    border-color:var(--correct);
    background:#f0fdf4;
  }
  .option-btn.correct .idx{background:var(--correct);color:#fff;}
  .option-btn.incorrect{
    border-color:var(--incorrect);
    background:#fef2f2;
  }
  .option-btn.incorrect .idx{background:var(--incorrect);color:#fff;}
  .option-btn.locked{cursor:default;}
  .option-btn.dim{opacity:0.55;}

  .feedback-box{
    margin-top:16px;
    padding:14px 16px;
    border-radius:12px;
    font-size:13.5px;
    line-height:1.7;
    animation:fadeIn .25s ease;
  }
  .feedback-box.correct{background:#f0fdf4; border:1px solid #bbf7d0;}
  .feedback-box.incorrect{background:#fef2f2; border:1px solid #fecaca;}
  .feedback-title{
    font-weight:700;
    font-size:14.5px;
    margin-bottom:6px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .feedback-title.correct{color:var(--correct);}
  .feedback-title.incorrect{color:var(--incorrect);}

  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:13px 18px;
    border-radius:12px;
    border:none;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    width:100%;
  }
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-secondary{background:#f1f5f9; color:var(--text);}
  .btn-secondary:hover{background:#e2e8f0;}
  .btn-row{display:flex; gap:10px; margin-top:16px;}
  .btn-row .btn{flex:1;}

  .next-wrap{margin-top:14px;}

  .result-score{
    text-align:center;
    padding:20px 0 10px;
  }
  .result-score .big{
    font-size:44px;
    font-weight:800;
    color:var(--primary);
  }
  .result-score .sub{
    font-size:14px;
    color:var(--muted);
    margin-top:4px;
  }
  .result-list{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin:14px 0;
    max-height:280px;
    overflow-y:auto;
  }
  .result-item{
    display:flex;
    align-items:flex-start;
    gap:8px;
    padding:10px 12px;
    border-radius:10px;
    background:#f8fafc;
    font-size:12.5px;
    line-height:1.5;
  }
  .result-item .mark{
    flex:0 0 auto;
    font-weight:800;
  }
  .result-item.ok .mark{color:var(--correct);}
  .result-item.ng .mark{color:var(--incorrect);}

  .hidden{display:none !important;}

  footer.foot{
    text-align:center;
    color:#cbd5e1;
    font-size:11px;
    padding:6px 0 20px;
  }
</style>

<style id="ios-compatibility">
  html, body {
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }
  body {
    min-height: 100dvh;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-right: max(16px, env(safe-area-inset-right));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    padding-left: max(16px, env(safe-area-inset-left));
  }
  button, input, select, textarea {
    font: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  button {
    touch-action: manipulation;
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>🧠 G検定 模擬テスト</h1>
    <p>全999問収録・章別出題／誤答復習対応</p>
  </header>

  <!-- HOME SCREEN -->
  <div id="screen-home" class="card">
    <div class="home-stats">
      <div>累計挑戦<br><b id="stat-total-attempts">0</b> 回</div>
      <div>平均正解率<br><b id="stat-avg-rate">--</b>%</div>
      <div>誤答保存<br><b id="stat-wrong-count">0</b> 問</div>
    </div>

    <div class="section-label">📚 章を選んで出題（10問）</div>
    <div class="cat-list" id="category-list"></div>

    <div class="section-label">🔁 復習</div>
    <div class="cat-list">
      <button class="cat-btn wrong" id="btn-wrong-review">
        <span>間違った問題を復習する</span>
        <span class="meta"><span class="badge red" id="wrong-review-badge">0問</span></span>
      </button>
    </div>

    <div class="section-label">⚙️ 管理</div>
    <div class="cat-list">
      <button class="cat-btn" id="btn-reset-data">
        <span>学習履歴をリセット</span>
        <span class="meta"><span class="count">全データの消去</span></span>
      </button>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="screen-quiz" class="card hidden">
    <div class="quiz-top">
      <span class="progress-text" id="quiz-progress-text">問題 1/10</span>
      <span class="progress-text" id="quiz-score-text">正解 0</span>
    </div>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="quiz-progress-fill" style="width:10%"></div></div>
    <div class="cat-chip" id="quiz-cat-chip">カテゴリ</div>
    <div class="question-text" id="quiz-question"></div>
    <div class="options" id="quiz-options"></div>
    <div id="quiz-feedback"></div>
    <div class="next-wrap hidden" id="quiz-next-wrap">
      <button class="btn btn-primary" id="btn-next-question">次の問題へ →</button>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="screen-result" class="card hidden">
    <div class="result-score">
      <div class="sub" id="result-cat-label">結果</div>
      <div class="big"><span id="result-correct">0</span>/<span id="result-total">10</span></div>
      <div class="sub">正解率 <b id="result-rate">0</b>%</div>
    </div>
    <div id="result-comment" class="feedback-box" style="text-align:center;"></div>
    <div class="section-label">📝 今回の内訳</div>
    <div class="result-list" id="result-list"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="btn-back-home">🏠 ホームへ</button>
      <button class="btn btn-primary" id="btn-retry-same">🔄 再挑戦</button>
    </div>
  </div>

  <footer class="foot">G検定 対策アプリ・PWA版</footer>
</div>

<script id="questions-data" type="application/json">
[
  {"id":1,"category":"第1章 人工知能とは","statement":"人工知能（AI）の定義に関する現在の状況として、最も適切なものを選べ。","options":["専門家の間で統一された定義が1つ存在し、世界中で共通認識となっている。","専門家の間でも統一された定義はなく、研究者によって定義が異なっている。","定義は法律によって厳密に定められており、それに合致しないものはAIと呼べない。","知能を持つメカのことだけを指し、形を持たないソフトウェアは含まれない。"],"correctAnswerIndex":1,"explanation":"AIには統一された1つの定義は存在せず、研究者によって解釈が異なります。"},
  {"id":2,"category":"第1章 人工知能とは","statement":"AIのレベル分類において、「レベル1（シンプルな制御プログラム）」に該当するものとして最も適切なものを選べ。","options":["探索や推論を用いて、あらかじめ入力されたルールで動く掃除ロボット","入力に対して必ず決まった出力を返す、エアコンや洗濯機などの自動化","大量のサンプルデータから学習するが、注目すべき特徴は人間が設計する検索エンジン","特徴量を自ら発見し学習するディープラーニング"],"correctAnswerIndex":1,"explanation":"レベル1は単に条件に合わせて特定の出力を返すルール制御機器などを指します。"},
  {"id":3,"category":"第3章 機械学習の手法","statement":"モデルの汎化性能を評価するためのデータ分割手法に関する記述のうち、ホールドアウト検証の説明として最も適切なものを選べ。","options":["データ全体をk個のブロックに分割し、1つをテストデータ、残りを訓練データとして学習と評価を繰り返す手法。","データを「訓練データ」と「テストデータ」の2つにシンプルに分割し、評価する手法。","データ全体を学習に使用し、同じデータでモデルの性能を評価する手法。","データからランダムに復元抽出を行って複数のデータセットを作成する手法。"],"correctAnswerIndex":1,"explanation":"ホールドアウト検証は、データセットを単純に訓練用とテスト用の2つに固定分割する手法です。"}
]
</script>

<script>
// PWA Service Worker 登録スクリプト
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('Service Worker Registered:', reg.scope))
      .catch(err => console.error('Service Worker Registration Failed:', err));
  });
}

// アプリ動作ロジック
(function () {
  let questions = [];
  try {
    questions = JSON.parse(document.getElementById('questions-data').textContent);
  } catch(e) {
    console.error('Data Load Error', e);
  }

  let state = {
    history: JSON.parse(localStorage.getItem('g_test_history') || '{"attempts":0,"totalCorrect":0,"totalQuestions":0}'),
    wrongIds: JSON.parse(localStorage.getItem('g_test_wrong_ids') || '[]'),
    currentQuiz: [],
    currentIndex: 0,
    currentScore: 0,
    currentCat: '',
    results: []
  };

  const el = id => document.getElementById(id);

  function saveStorage() {
    localStorage.setItem('g_test_history', JSON.stringify(state.history));
    localStorage.setItem('g_test_wrong_ids', JSON.stringify(state.wrongIds));
  }

  function initHome() {
    el('screen-home').classList.remove('hidden');
    el('screen-quiz').classList.add('hidden');
    el('screen-result').classList.add('hidden');

    el('stat-total-attempts').textContent = state.history.attempts;
    const avg = state.history.totalQuestions > 0 ? Math.round((state.history.totalCorrect / state.history.totalQuestions) * 100) : '--';
    el('stat-avg-rate').textContent = avg;
    el('stat-wrong-count').textContent = state.wrongIds.length;
    el('wrong-review-badge').textContent = state.wrongIds.length + '問';

    const catMap = {};
    questions.forEach(q => {
      catMap[q.category] = (catMap[q.category] || 0) + 1;
    });

    const catList = el('category-list');
    catList.innerHTML = '';
    Object.keys(catMap).forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'cat-btn';
      btn.innerHTML = `<span>${cat}</span><span class="meta"><span class="count">${catMap[cat]}問収録</span></span>`;
      btn.onclick = () => startQuiz(cat);
      catList.appendChild(btn);
    });
  }

  function startQuiz(cat) {
    state.currentCat = cat;
    if (cat === '__WRONG__') {
      state.currentQuiz = questions.filter(q => state.wrongIds.includes(q.id));
    } else {
      state.currentQuiz = questions.filter(q => q.category === cat).sort(() => 0.5 - Math.random()).slice(0, 10);
    }

    if (state.currentQuiz.length === 0) {
      alert('該当する問題がありません。');
      return;
    }

    state.currentIndex = 0;
    state.currentScore = 0;
    state.results = [];

    el('screen-home').classList.add('hidden');
    el('screen-quiz').classList.remove('hidden');
    renderQuestion();
  }

  function renderQuestion() {
    const q = state.currentQuiz[state.currentIndex];
    el('quiz-progress-text').textContent = `問題 ${state.currentIndex + 1}/${state.currentQuiz.length}`;
    el('quiz-score-text').textContent = `正解 ${state.currentScore}`;
    el('quiz-progress-fill').style.width = `${((state.currentIndex + 1) / state.currentQuiz.length) * 100}%`;
    el('quiz-cat-chip').textContent = q.category;
    el('quiz-question').textContent = q.statement;
    el('quiz-feedback').innerHTML = '';
    el('quiz-next-wrap').classList.add('hidden');

    const opts = el('quiz-options');
    opts.innerHTML = '';
    q.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = `<span class="idx">${idx + 1}</span><span>${opt}</span>`;
      btn.onclick = () => selectOption(idx);
      opts.appendChild(btn);
    });
  }

  function selectOption(selectedIdx) {
    const q = state.currentQuiz[state.currentIndex];
    const btns = el('quiz-options').children;
    for (let b of btns) b.classList.add('locked');

    const isCorrect = selectedIdx === q.correctAnswerIndex;
    if (isCorrect) {
      state.currentScore++;
      btns[selectedIdx].classList.add('correct');
      state.wrongIds = state.wrongIds.filter(id => id !== q.id);
    } else {
      btns[selectedIdx].classList.add('incorrect');
      btns[q.correctAnswerIndex].classList.add('correct');
      if (!state.wrongIds.includes(q.id)) state.wrongIds.push(q.id);
    }

    state.results.push({ question: q.statement, isCorrect });
    saveStorage();

    const fb = el('quiz-feedback');
    fb.className = `feedback-box ${isCorrect ? 'correct' : 'incorrect'}`;
    fb.innerHTML = `
      <div class="feedback-title ${isCorrect ? 'correct' : 'incorrect'}">${isCorrect ? '⭕️ 正解！' : '❌ 不正解...'}</div>
      <div>${q.explanation}</div>
    `;

    el('quiz-next-wrap').classList.remove('hidden');
  }

  el('btn-next-question').onclick = () => {
    state.currentIndex++;
    if (state.currentIndex < state.currentQuiz.length) {
      renderQuestion();
    } else {
      showResult();
    }
  };

  function showResult() {
    el('screen-quiz').classList.add('hidden');
    el('screen-result').classList.remove('hidden');

    state.history.attempts++;
    state.history.totalCorrect += state.currentScore;
    state.history.totalQuestions += state.currentQuiz.length;
    saveStorage();

    const total = state.currentQuiz.length;
    const rate = Math.round((state.currentScore / total) * 100);

    el('result-cat-label').textContent = state.currentCat === '__WRONG__' ? '復習モード' : state.currentCat;
    el('result-correct').textContent = state.currentScore;
    el('result-total').textContent = total;
    el('result-rate').textContent = rate;

    const list = el('result-list');
    list.innerHTML = '';
    state.results.forEach(res => {
      const item = document.createElement('div');
      item.className = `result-item ${res.isCorrect ? 'ok' : 'ng'}`;
      item.innerHTML = `<span class="mark">${res.isCorrect ? '⭕️' : '❌'}</span><span>${res.question}</span>`;
      list.appendChild(item);
    });
  }

  el('btn-wrong-review').onclick = () => {
    if (state.wrongIds.length === 0) {
      alert('間違えた問題はありません！');
      return;
    }
    startQuiz('__WRONG__');
  };

  el('btn-back-home').onclick = initHome;
  el('btn-retry-same').onclick = () => startQuiz(state.currentCat);
  el('btn-reset-data').onclick = () => {
    if (confirm('すべての学習履歴と誤答データを消去しますか？')) {
      localStorage.clear();
      state.history = { attempts: 0, totalCorrect: 0, totalQuestions: 0 };
      state.wrongIds = [];
      initHome();
    }
  };

  initHome();
})();
</script>
</body>
</html>
